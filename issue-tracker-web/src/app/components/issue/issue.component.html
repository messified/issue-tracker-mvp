<div class="issue-table-container">

  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Search issues</mat-label>
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Search by title, status, or priority"
    />
  </mat-form-field>

  <table
    mat-table
    [dataSource]="dataSource"
    matSort
    class="clickable-table"
  >

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let issue">{{ issue.id }}</td>
    </ng-container>

    <!-- Title -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
      <td mat-cell *matCellDef="let issue">{{ issue.title }}</td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let issue">{{ issue.status }}</td>
    </ng-container>

    <!-- Priority -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
      <td mat-cell *matCellDef="let issue">{{ issue.priority }}</td>
    </ng-container>

    <!-- Assignee -->
    <ng-container matColumnDef="assigneeId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Assignee</th>
      <td mat-cell *matCellDef="let issue">
        {{ issue.assigneeId ?? '—' }}
      </td>
    </ng-container>

    <!-- Updated -->
    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
      <td mat-cell *matCellDef="let issue">{{ issue.updatedAt }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      (click)="goToIssue(row)"
    ></tr>

  </table>

  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons>
  </mat-paginator>

</div>
